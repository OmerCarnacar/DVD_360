name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Test
        run: dotnet test tests/Dvd360.Tests -c Release

      - name: Publish (single self-contained exe)
        run: |
          dotnet publish src/Dvd360.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/app
          dotnet publish src/Dvd360.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/cli
          Compress-Archive -Path publish/app/DVD360.exe, publish/cli/dvd360.exe, LICENSE, README.md -DestinationPath DVD360-win-x64.zip

      - name: Smoke test (the packed exe must start without crashing)
        shell: pwsh
        run: |
          $p = Start-Process publish/app/DVD360.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "DVD360.exe crashed on start (exit code $($p.ExitCode))" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@v5
        with:
          name: DVD360-win-x64
          path: DVD360-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DVD360-win-x64.zip
            publish/app/DVD360.exe
          generate_release_notes: true
